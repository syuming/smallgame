<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數一數</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="數一數">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd34e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="../shared/kit.css">
<style>
  /* Layout: same sunny play mat; toolbar, a white counting tray (things in rows of five, like a ten-frame), a row of big number answers, and the progress tray. */
  .app { height: 100%; display: flex; flex-direction: column; gap: 12px; padding-block: 12px; }
  @media (max-width: 1100px) { .chip .txt { display: none; } }
  .chip .num { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1; }

  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 3vh, 28px); }
  .ask { display: flex; align-items: center; gap: 10px; padding: 6px 20px; border-radius: 999px; background: var(--paper); box-shadow: 0 5px 0 var(--sun-deep); font-weight: 900; font-size: 1.4rem; border: 0; cursor: pointer; }
  .ask .emo { font-family: var(--emoji); }
  .tray-box {
    display: flex; align-items: center; justify-content: center; gap: calc(var(--it) * 0.35);
    padding: calc(var(--it) * 0.3); border-radius: 26px; background: var(--paper); box-shadow: 0 7px 0 var(--sun-deep);
    max-width: 100%;
  }
  .pile { display: grid; grid-template-columns: repeat(var(--cols, 5), var(--it)); gap: calc(var(--it) * 0.12); }
  .plus { font-family: var(--font-display); font-weight: 800; font-size: calc(var(--it) * 0.8); color: var(--cobalt-deep); line-height: 1; }
  .thing {
    position: relative; width: var(--it); height: var(--it); padding: 0; border: 0; border-radius: 22%;
    background: #fff7dc; cursor: pointer; font-family: var(--emoji); font-size: calc(var(--it) * 0.66); line-height: 1;
    display: grid; place-items: center; transition: scale .12s;
  }
  .thing:active { scale: .92; }
  .thing.counted { background: #d9f5e3; box-shadow: inset 0 0 0 3px var(--leaf); }
  .thing .tag {
    position: absolute; top: -10%; right: -10%; min-width: 46%; height: 46%; padding: 0 4px; border-radius: 999px;
    background: var(--leaf); color: var(--paper); font-family: var(--font-display); font-weight: 800; font-size: calc(var(--it) * 0.3);
    display: grid; place-items: center; box-shadow: 0 2px 0 #1f8a52;
  }

  .answers { display: flex; gap: var(--agap, 16px); justify-content: center; flex-wrap: wrap; }
  .answer {
    width: var(--a); height: var(--a); border: 0; padding: 0; cursor: pointer; border-radius: 24%;
    background: var(--paper); box-shadow: 0 6px 0 var(--sun-deep); color: var(--cobalt-deep);
    font-family: var(--font-display); font-weight: 800; font-size: calc(var(--a) * 0.6); line-height: 1;
    display: grid; place-items: center; transition: transform .12s, opacity .2s;
  }
  .answer:active { transform: translateY(4px); }
  .answer.nope { animation: wiggle .4s ease; opacity: .35; cursor: default; }
  .answer.right { background: var(--leaf); color: var(--paper); box-shadow: 0 6px 0 #1f8a52; animation: hop .5s ease; }
  @keyframes wiggle { 0%,100% { rotate: 0deg; } 25% { rotate: -10deg; } 75% { rotate: 10deg; } }
  @keyframes hop { 0%,100% { translate: 0 0; } 40% { translate: 0 -14px; } }

  .progress { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
  .slot {
    width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.55);
    border: 3px dashed var(--sun-deep); display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; color: var(--cobalt-deep);
  }
  .slot.full { background: var(--paper); border: 3px solid var(--leaf); animation: pop .4s ease; }
  @media (max-width: 560px) {
    .slot { width: 36px; height: 36px; font-size: 1.1rem; }
    .ask { font-size: 1.1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .answer.nope, .answer.right, .slot.full { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="chip" href="../" aria-label="回遊戲選單"><span class="emo">🏠</span></a>
    <h1 class="brand">數一數</h1>
    <div class="group" id="modes" role="group" aria-label="選擇模式"></div>
    <div class="group" id="levels" role="group" aria-label="選擇難度"></div>
    <div class="group">
      <button class="chip" id="sound" aria-pressed="true" aria-label="聲音開關"><span class="emo">🔊</span></button>
      <button class="chip" id="restart" aria-label="重新開始"><span class="emo">🔄</span></button>
    </div>
  </header>
  <main class="stage" id="stage">
    <button class="ask" id="ask" aria-live="polite"></button>
    <div class="tray-box" id="box" aria-label="點一下東西，就會幫你數"></div>
    <div class="answers" id="answers" role="group" aria-label="答案"></div>
  </main>
  <footer class="progress" id="progress" aria-label="答對的題目"></footer>
</div>

<div class="win" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="big">🎉</div>
    <h2 id="winTitle">好棒！全部答對了！</h2>
    <div class="stars" id="stars"></div>
    <div class="actions">
      <button class="btn" id="again">再玩一次</button>
      <button class="btn alt" id="next">下一關 ➜</button>
      <a class="btn home" href="../">🏠 回選單</a>
    </div>
  </div>
</div>

<script src="../shared/kit.js"></script>
<script>
(() => {
  // Things to count, each with its Chinese measure word so questions sound natural.
  const THINGS = [
    ['🍎','蘋果','個'], ['🍌','香蕉','根'], ['🍓','草莓','顆'], ['🐶','小狗','隻'], ['🐱','小貓','隻'], ['🐰','兔子','隻'],
    ['🚗','汽車','台'], ['⭐','星星','顆'], ['🎈','氣球','個'], ['🐟','小魚','條'], ['🌸','花','朵'], ['🍪','餅乾','片'],
  ].map(([e, name, unit]) => ({ e, name, unit }));
  const MODES = {
    count: { label: '數數', icon: '<span class="emo">🍎</span>' },
    add:   { label: '加法', icon: '<span class="num">1+2</span>' },
  };
  const LEVELS = [
    { label: '簡單', max: 5,  options: 3 },
    { label: '普通', max: 10, options: 3 },
    { label: '挑戰', max: 10, options: 4 },
  ];
  const ROUND = 8;

  const $ = id => document.getElementById(id);
  const stage = $('stage'), box = $('box'), answersEl = $('answers'), progress = $('progress');
  const store = Kit.store('count');
  const state = {
    mode: MODES[store.get('mode', 'count')] ? store.get('mode', 'count') : 'count',
    level: Math.min(LEVELS.length - 1, Math.max(0, store.get('level', 0) | 0)),
    sound: store.get('sound', true) !== false,
    q: null, done: 0, wrong: 0, lock: false, tapped: 0, lastAnswer: -1, game: 0,
  };
  const tone = (...args) => { if (state.sound) Kit.tone(...args); };
  const say = text => state.sound ? Kit.say(text, { rate: 0.85 }) : Promise.resolve();
  const wait = ms => new Promise(res => setTimeout(res, ms));
  const sfx = {
    tap: n => tone(440 * Math.pow(2, Math.min(n - 1, 12) / 12), 0, 0.12, 'triangle', 0.12),
    right: () => [523, 659, 784].forEach((f, i) => tone(f, i * 0.09, 0.3)),
    miss: () => { tone(330, 0, 0.18, 'sine', 0.1); tone(294, 0.12, 0.22, 'sine', 0.1); },
    win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.35, 'triangle', 0.15)),
  };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  /* ---------- questions ---------- */
  function makeQuestion() {
    const lv = LEVELS[state.level], thing = THINGS[rnd(0, THINGS.length - 1)];
    let answer, a = 0, b = 0;
    do {
      if (state.mode === 'count') { answer = rnd(1, lv.max); }
      else { answer = rnd(2, lv.max); a = rnd(1, answer - 1); b = answer - a; }
    } while (answer === state.lastAnswer);     // avoid the same answer twice in a row
    state.lastAnswer = answer;
    // Wrong options sit close to the answer, so the child really has to count.
    const pool = [];
    for (let d = 1; pool.length < 6 && d <= lv.max; d++) for (const v of [answer - d, answer + d]) if (v >= 1 && v <= lv.max) pool.push(v);
    const wrong = pool.slice(0, 4).sort(() => Math.random() - 0.5).slice(0, lv.options - 1);
    const options = [answer, ...wrong].sort((x, y) => x - y);
    return { thing, answer, a, b, options };
  }

  function newGame() {
    $('win').hidden = true; Kit.confetti.stop();
    Object.assign(state, { done: 0, wrong: 0, lock: false, game: state.game + 1 });
    progress.innerHTML = '';
    for (let i = 0; i < ROUND; i++) { const s = document.createElement('div'); s.className = 'slot'; progress.append(s); }
    syncToolbar();
    ask();
  }

  function ask() {
    const q = state.q = makeQuestion();
    state.tapped = 0;
    const { thing } = q;
    $('ask').innerHTML = state.mode === 'count'
      ? `有幾${thing.unit}<span class="emo">${thing.e}</span>？ 🔈`
      : `${q.a} ＋ ${q.b} ＝ ？ 🔈`;
    $('ask').setAttribute('aria-label', (state.mode === 'count' ? `有幾${thing.unit}${thing.name}？` : `${q.a}加${q.b}是多少？`) + '點一下再聽一次');

    box.innerHTML = '';
    const groups = state.mode === 'count' ? [q.answer] : [q.a, q.b];
    groups.forEach((n, gi) => {
      if (gi) { const p = document.createElement('span'); p.className = 'plus'; p.textContent = '+'; box.append(p); }
      const grp = document.createElement('div'); grp.className = 'pile';
      grp.style.setProperty('--cols', Math.min(5, n));
      for (let i = 0; i < n; i++) {
        const t = document.createElement('button');
        t.className = 'thing'; t.textContent = thing.e; t.setAttribute('aria-label', thing.name);
        t.addEventListener('click', () => countIt(t));
        grp.append(t);
      }
      box.append(grp);
    });

    answersEl.innerHTML = '';
    for (const v of q.options) {
      const b = document.createElement('button');
      b.className = 'answer'; b.textContent = v; b.setAttribute('aria-label', String(v));
      b.addEventListener('click', () => answer(v, b));
      answersEl.append(b);
    }
    layout();
    prompt();
  }
  function prompt() {
    const q = state.q;
    say(state.mode === 'count' ? `有幾${q.thing.unit}${q.thing.name}？` : `${q.a}加${q.b}，是多少？`);
  }
  $('ask').addEventListener('click', () => { Kit.audio(); prompt(); });

  // Tapping a thing numbers it, like counting with a finger. Tapping again does nothing.
  function countIt(t) {
    if (t.classList.contains('counted') || state.lock) return;
    Kit.audio();
    state.tapped++;
    t.classList.add('counted');
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = state.tapped; t.append(tag);
    sfx.tap(state.tapped); say(String(state.tapped));
  }

  function answer(v, btn) {
    if (state.lock || btn.classList.contains('nope')) return;
    Kit.audio();
    const q = state.q;
    if (v === q.answer) {
      state.lock = true;
      btn.classList.add('right'); sfx.right();
      const spoken = say(state.mode === 'count' ? `答對了！${v}${q.thing.unit}${q.thing.name}` : `答對了！${q.a}加${q.b}等於${v}`);
      const slot = progress.children[state.done]; slot.textContent = v; slot.classList.add('full');
      state.done++;
      // Move on once the whole sentence has been spoken, but never sooner than 1.2 s (Kit.say has its own time-out,
      // so a device without speech can't get stuck). Skip it if a new game was started in the meantime.
      const game = state.game;
      Promise.all([spoken, wait(1200)]).then(() => {
        if (game !== state.game) return;
        state.lock = false; if (state.done >= ROUND) win(); else ask();
      });
    } else {
      state.wrong++;
      btn.classList.add('nope'); btn.setAttribute('aria-disabled', 'true'); sfx.miss();
      say(`這是${v}，再數數看`);
    }
  }

  function win() {
    $('stars').innerHTML = Kit.stars(state.wrong <= 2 ? 3 : 2); // always encouraging: at least 2 stars
    $('next').hidden = state.level >= LEVELS.length - 1;
    $('win').hidden = false;
    sfx.win(); say('好棒！全部答對了！');
    Kit.confetti.start();
    $('again').focus();
  }
  $('again').addEventListener('click', newGame);
  $('next').addEventListener('click', () => {
    state.level = Math.min(LEVELS.length - 1, state.level + 1); store.set('level', state.level); newGame();
  });

  /* ---------- toolbar ---------- */
  for (const [key, m] of Object.entries(MODES)) {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.key = key; b.setAttribute('aria-label', m.label);
    b.innerHTML = `${m.icon}<span class="txt">${m.label}</span>`;
    b.addEventListener('click', () => { state.mode = key; store.set('mode', key); newGame(); });
    $('modes').append(b);
  }
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.setAttribute('aria-label', lv.label);
    b.innerHTML = `<span class="dots">${'<i></i>'.repeat(i + 1)}</span><span class="txt">${lv.label}</span>`;
    b.addEventListener('click', () => { state.level = i; store.set('level', i); newGame(); });
    $('levels').append(b);
  });
  $('sound').addEventListener('click', () => {
    state.sound = !state.sound; store.set('sound', state.sound);
    if (!state.sound) Kit.hush();
    syncToolbar();
  });
  $('restart').addEventListener('click', newGame);
  function syncToolbar() {
    [...$('modes').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.key === state.mode));
    [...$('levels').children].forEach((b, i) => b.setAttribute('aria-pressed', i === state.level));
    $('sound').setAttribute('aria-pressed', state.sound);
    $('sound').querySelector('.emo').textContent = state.sound ? '🔊' : '🔇';
  }

  /* ---------- sizing: biggest things and answer buttons that fit ---------- */
  function layout() {
    const q = state.q; if (!q) return;
    const W = stage.clientWidth, H = stage.clientHeight;
    const n = Math.max(1, answersEl.children.length), gap = Math.max(12, Math.min(22, Math.round(W / 45)));
    const a = Math.floor(Math.max(64, Math.min(130, (W - gap * (n - 1)) / n, H * 0.2)));
    // columns across the tray: up to 5 per group, plus a "+" between groups
    const groups = state.mode === 'count' ? [q.answer] : [q.a, q.b];
    const cols = groups.reduce((s, g) => s + Math.min(5, g), 0) + (groups.length - 1) * 1.2;
    const rows = Math.max(...groups.map(g => Math.ceil(g / 5)));
    const askH = 60, room = H - a - askH - 80;
    const it = Math.floor(Math.max(34, Math.min(110, (W - 40) / (cols * 1.15 + 0.6), room / (rows * 1.15 + 0.6))));
    stage.style.setProperty('--a', a + 'px'); stage.style.setProperty('--agap', gap + 'px'); stage.style.setProperty('--it', it + 'px');
  }
  new ResizeObserver(layout).observe(stage);

  newGame();
})();
</script>
</body>
</html>
