<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>敲敲地鼠</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="敲地鼠">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd34e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="../shared/kit.css">
<style>
  /* Layout: same sunny play mat as the other games; toolbar, a "what to tap" bubble, a square grass field of 3×3 holes, and a 10-slot "caught" tray. */
  :root {
    --grass: #5cbf5a;      /* the field */
    --grass-deep: #3f9a43;
    --dirt: #6b4426;       /* hole */
    --dirt-deep: #8a5a33;  /* hole's front lip */
  }
  .app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; }

  /* ---------- "tap this" bubble ---------- */
  .ask { display: flex; justify-content: center; }
  .bubble {
    display: inline-flex; align-items: center; gap: 12px; padding: 6px 22px; border-radius: 999px;
    background: var(--paper); box-shadow: 0 5px 0 var(--sun-deep);
    font-weight: 900; font-size: 1.6rem;
  }
  .bubble .emo { font-family: var(--emoji); font-size: 2.6rem; line-height: 1.1; }
  .badge {
    display: inline-grid; place-items: center; border-radius: 50%;
    background: var(--paper); color: var(--cobalt-deep); border: 4px solid var(--cobalt);
    font-family: var(--font-display); font-weight: 800; line-height: 1;
  }
  .bubble .badge { width: 52px; height: 52px; font-size: 2rem; }

  /* ---------- field ---------- */
  .board { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
  .field {
    width: var(--field); height: var(--field); padding: calc(var(--field) * 0.04);
    border-radius: calc(var(--field) * 0.08); background: var(--grass);
    background-image: radial-gradient(var(--grass-deep) 2px, transparent 2.5px);
    background-size: 22px 22px;
    box-shadow: 0 8px 0 var(--grass-deep);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: calc(var(--field) * 0.02);
  }
  .hole { position: relative; padding: 0; border: 0; background: none; cursor: pointer; --cell: calc(var(--field) * 0.293); }
  .pit, .rim { position: absolute; left: 8%; width: 84%; border-radius: 50%; }
  .pit { bottom: 12%; height: 30%; background: var(--dirt); box-shadow: inset 0 8px 0 rgba(0,0,0,.25); }
  .rim { bottom: 8%; height: 18%; background: var(--dirt-deep); clip-path: inset(50% 0 0 0); z-index: 2; }
  .window { position: absolute; inset: 0 0 27% 0; overflow: hidden; pointer-events: none; }
  .critter {
    position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 105%);
    display: flex; flex-direction: column; align-items: center; transition: transform .2s ease-out;
  }
  .critter .emo { font-family: var(--emoji); font-size: calc(var(--cell) * 0.52); line-height: 1; }
  .critter .badge { width: calc(var(--cell) * 0.34); height: calc(var(--cell) * 0.34); font-size: calc(var(--cell) * 0.24); margin-bottom: -6%; position: relative; z-index: 1; }
  .critter.with-num .emo { font-size: calc(var(--cell) * 0.4); }
  .hole.up .critter { transform: translate(-50%, 0); }
  .hole.hit .critter { transform: translate(-50%, 0) scale(1.15, .8); transition-duration: .08s; }
  .hole.nope .critter { animation: wiggle .3s ease; }
  .pow {
    position: absolute; left: 50%; top: 4%; translate: -50% 0; z-index: 3; pointer-events: none;
    font-family: var(--emoji); font-size: calc(var(--cell) * 0.4); opacity: 0; scale: .3;
  }
  .hole.hit .pow { animation: pow .45s ease-out; }
  @keyframes pow { 0% { opacity: 1; scale: .3; } 60% { opacity: 1; scale: 1.2; } 100% { opacity: 0; scale: 1.3; } }
  @keyframes wiggle { 0%,100% { rotate: 0deg; } 25% { rotate: -10deg; } 75% { rotate: 10deg; } }

  /* ---------- start / pause button ---------- */
  .start {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; pointer-events: none;
  }
  .start button {
    pointer-events: auto; width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--paper);
    background: var(--coral); color: var(--paper); box-shadow: 0 8px 0 #d4483a; cursor: pointer;
    font-weight: 900; font-size: 1.4rem; display: grid; place-content: center; gap: 2px;
    animation: breathe 1.6s ease-in-out infinite;
  }
  .start button .play { font-size: 3.4rem; line-height: 1; translate: 6% 0; }
  .start button:active { transform: translateY(6px); box-shadow: 0 2px 0 #d4483a; }
  @keyframes breathe { 50% { scale: 1.06; } }

  /* ---------- caught tray ---------- */
  .tray { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
  .slot {
    width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.55);
    border: 3px dashed var(--sun-deep); display: grid; place-items: center;
    font-family: var(--emoji); font-size: 1.5rem;
  }
  .slot.full { background: var(--paper); border: 3px solid var(--leaf); animation: pop .4s ease; }
  .slot .badge { width: 34px; height: 34px; font-size: 1.2rem; border-width: 3px; }
  /* ---------- win panel ---------- */
  @media (max-width: 1100px) { .chip .txt { display: none; } }
  @media (max-width: 560px) {
    .slot { width: 36px; height: 36px; font-size: 1.2rem; }
    .slot .badge { width: 28px; height: 28px; font-size: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .critter { transition: none; }
    .hole.nope .critter, .hole.hit .pow, .slot.full, .panel, .start button { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="chip" href="../" aria-label="回遊戲選單"><span class="emo">🏠</span></a>
    <h1 class="brand">敲敲地鼠</h1>
    <div class="group" id="modes" role="group" aria-label="選擇模式"></div>
    <div class="group" id="speeds" role="group" aria-label="選擇速度"></div>
    <div class="group">
      <button class="chip" id="sound" aria-pressed="true" aria-label="聲音開關"><span class="emo">🔊</span></button>
      <button class="chip" id="restart" aria-label="重新開始"><span class="emo">🔄</span></button>
    </div>
  </header>
  <div class="ask"><div class="bubble" id="ask" aria-live="polite"></div></div>
  <main class="board" id="board">
    <div class="field" id="field"></div>
    <div class="start" id="start"><button id="go" aria-label="開始"><span class="play">▶</span><span id="goText">開始</span></button></div>
  </main>
  <footer class="tray" id="tray" aria-label="已敲到的數量"></footer>
</div>

<div class="win" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="big">🎉</div>
    <h2 id="winTitle">好厲害！敲到 10 隻了！</h2>
    <div class="stars" id="stars"></div>
    <div class="actions">
      <button class="btn" id="again">再玩一次</button>
      <button class="btn alt" id="next">快一點 ➜</button>
    </div>
  </div>
</div>

<script src="../shared/kit.js"></script>
<script>
(() => {
  const GOAL = 10;
  const MODES = {
    mole:   { icon: '🐹', label: '地鼠' },
    animal: { icon: '🐰', label: '動物' },
    number: { icon: '🔢', label: '數字' },
  };
  const ANIMALS = [['🐰','兔子'],['🐸','青蛙'],['🐻','小熊'],['🐷','小豬'],['🐱','小貓'],['🐶','小狗'],['🐵','猴子'],['🐥','小雞']];
  const SPEEDS = [
    { label: '慢慢', upMs: 2600, every: 1100, maxUp: 2 },
    { label: '普通', upMs: 1900, every: 900,  maxUp: 2 },
    { label: '快快', upMs: 1300, every: 700,  maxUp: 3 },
  ];

  const $ = id => document.getElementById(id);
  const field = $('field'), board = $('board'), tray = $('tray');
  const store = Kit.store('whack');

  const state = {
    mode: MODES[store.get('mode', 'mole')] ? store.get('mode', 'mole') : 'mole',
    speed: Math.min(SPEEDS.length - 1, Math.max(0, store.get('speed', 0) | 0)),
    sound: store.get('sound', true) !== false,
    target: null, hits: 0, wrong: 0, running: false, spawner: 0, sinceTarget: 0,
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];

  /* ---------- sound ---------- */
  // Sound, speech and confetti come from ../shared/kit.js; these follow the game's sound switch.
  const audio = () => (state.sound ? Kit.audio() : null);
  const tone = (...args) => { if (state.sound) Kit.tone(...args); };
  const sfx = {
    pop: () => tone(500, 0, 0.12, 'sine', 0.06, 900),
    bonk: () => { tone(180, 0, 0.12, 'square', 0.12, 90); tone(880, 0.05, 0.2, 'triangle', 0.14, 1320); },
    miss: () => { tone(330, 0, 0.18, 'sine', 0.1); tone(294, 0.12, 0.22, 'sine', 0.1); },
    win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.35, 'triangle', 0.15)),
  };
  const say = text => { if (state.sound) Kit.say(text); };

  /* ---------- what each critter looks like ---------- */
  // A critter is { key, html, name }; key decides whether it matches the round's target.
  function critterFor(kind, value) {
    if (kind === 'mole') return { key: 'mole', html: '<span class="emo">🐹</span>', small: '🐹', name: '地鼠' };
    if (kind === 'animal') return { key: value[0], html: `<span class="emo">${value[0]}</span>`, small: value[0], name: value[1] };
    return { key: 'n' + value, html: `<span class="badge">${value}</span><span class="emo">🐹</span>`, small: `<span class="badge">${value}</span>`, name: String(value), num: true };
  }
  function pickTarget() {
    if (state.mode === 'mole') return critterFor('mole');
    if (state.mode === 'animal') return critterFor('animal', rand(ANIMALS));
    return critterFor('number', 1 + Math.floor(Math.random() * 9));
  }
  function pickDecoy() {
    if (state.mode === 'animal') return critterFor('animal', rand(ANIMALS.filter(a => a[0] !== state.target.key)));
    const nums = [1,2,3,4,5,6,7,8,9].filter(n => 'n' + n !== state.target.key);
    return critterFor('number', rand(nums));
  }
  function renderAsk() {
    const t = state.target;
    $('ask').innerHTML = state.mode === 'number'
      ? `敲 <span class="badge">${t.name}</span>`
      : `敲 <span class="emo">${t.small}</span>`;
    $('ask').setAttribute('aria-label', `敲${t.name}`);
  }
  function sayTarget() {
    say(state.mode === 'mole' ? '敲地鼠！' : state.mode === 'number' ? `敲數字 ${state.target.name}！` : `敲${state.target.name}！`);
  }

  /* ---------- holes ---------- */
  const holes = [];
  for (let i = 0; i < 9; i++) {
    const el = document.createElement('button');
    el.className = 'hole'; el.setAttribute('aria-label', '洞');
    el.innerHTML = '<span class="pit"></span><span class="window"><span class="critter"></span></span><span class="rim"></span><span class="pow">💥</span>';
    const h = { el, critter: el.querySelector('.critter'), up: false, busy: false, hit: false, data: null, timer: 0 };
    el.addEventListener('pointerdown', e => { e.preventDefault(); tap(h); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(h); } });
    field.append(el); holes.push(h);
  }

  function popUp(h, data) {
    h.data = data; h.up = true; h.busy = true; h.hit = false;
    h.critter.innerHTML = data.html;
    h.critter.classList.toggle('with-num', !!data.num);
    h.el.setAttribute('aria-label', data.name);
    h.el.classList.add('up');
    sfx.pop();
    h.timer = setTimeout(() => hide(h), SPEEDS[state.speed].upMs);
  }
  function hide(h, delay = 0) {
    clearTimeout(h.timer);
    h.timer = setTimeout(() => {
      h.up = false;
      h.el.classList.remove('up', 'hit', 'nope');
      h.el.setAttribute('aria-label', '洞');
      setTimeout(() => { h.busy = false; }, 300); // let it sink before reusing the hole
    }, delay);
  }
  function hideAll() { holes.forEach(h => { clearTimeout(h.timer); h.up = false; h.busy = false; h.el.classList.remove('up', 'hit', 'nope'); }); }

  function spawn() {
    if (!state.running) return;
    const cfg = SPEEDS[state.speed];
    const upCount = holes.filter(h => h.up).length;
    const free = holes.filter(h => !h.busy);
    if (upCount >= cfg.maxUp || !free.length) return;
    // Targets show up about half the time, and never more than two decoys in a row.
    const wantTarget = state.mode === 'mole' || state.sinceTarget >= 2 || Math.random() < 0.5;
    state.sinceTarget = wantTarget ? 0 : state.sinceTarget + 1;
    popUp(rand(free), wantTarget ? state.target : pickDecoy());
  }

  function tap(h) {
    if (!state.running || !h.up || h.hit) return;
    audio();
    if (h.data.key === state.target.key) {
      h.hit = true; h.el.classList.add('hit'); sfx.bonk();
      const slot = tray.children[state.hits];
      slot.innerHTML = state.target.small; slot.classList.add('full');
      state.hits++;
      hide(h, 350);
      if (state.hits >= GOAL) finish();
    } else {
      state.wrong++; h.hit = true; // resolved: ignore further taps while it sinks
      h.el.classList.add('nope'); sfx.miss();
      hide(h, 350);
    }
  }

  /* ---------- round flow ---------- */
  function newGame() {
    stop(); hideAll();
    $('win').hidden = true; stopConfetti();
    Object.assign(state, { target: pickTarget(), hits: 0, wrong: 0, sinceTarget: 0 });
    renderAsk();
    tray.innerHTML = '';
    for (let i = 0; i < GOAL; i++) { const s = document.createElement('div'); s.className = 'slot'; tray.append(s); }
    $('goText').textContent = '開始';
    $('start').hidden = false;
    syncToolbar();
  }
  function begin() {
    audio(); sayTarget();
    $('start').hidden = true;
    state.running = true;
    clearInterval(state.spawner);
    setTimeout(spawn, 700);
    state.spawner = setInterval(spawn, SPEEDS[state.speed].every);
  }
  function stop() { state.running = false; clearInterval(state.spawner); }
  function pause() {
    if (!state.running) return;
    stop(); hideAll();
    $('goText').textContent = '繼續';
    $('start').hidden = false;
  }
  function finish() {
    stop();
    setTimeout(() => {
      hideAll();
      const stars = state.wrong <= 3 ? 3 : 2; // always encouraging: at least 2 stars
      $('stars').innerHTML = Kit.stars(stars);
      $('next').hidden = state.speed >= SPEEDS.length - 1;
      $('win').hidden = false;
      sfx.win(); say('好厲害！');
      startConfetti();
      $('again').focus();
    }, 500);
  }
  $('go').addEventListener('click', begin);
  $('again').addEventListener('click', () => { newGame(); begin(); });
  $('next').addEventListener('click', () => {
    state.speed = Math.min(SPEEDS.length - 1, state.speed + 1); store.set('speed', state.speed);
    newGame(); begin();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  /* ---------- toolbar ---------- */
  for (const [key, m] of Object.entries(MODES)) {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.key = key; b.setAttribute('aria-label', m.label);
    b.innerHTML = `<span class="emo">${m.icon}</span><span class="txt">${m.label}</span>`;
    b.addEventListener('click', () => { state.mode = key; store.set('mode', key); newGame(); });
    $('modes').append(b);
  }
  SPEEDS.forEach((sp, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.setAttribute('aria-label', sp.label);
    b.innerHTML = `<span class="dots">${'<i></i>'.repeat(i + 1)}</span><span class="txt">${sp.label}</span>`;
    b.addEventListener('click', () => { state.speed = i; store.set('speed', i); newGame(); });
    $('speeds').append(b);
  });
  $('sound').addEventListener('click', () => {
    state.sound = !state.sound; store.set('sound', state.sound);
    if (!state.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
    syncToolbar();
  });
  $('restart').addEventListener('click', newGame);
  function syncToolbar() {
    [...$('modes').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.key === state.mode));
    [...$('speeds').children].forEach((b, i) => b.setAttribute('aria-pressed', i === state.speed));
    $('sound').setAttribute('aria-pressed', state.sound);
    $('sound').querySelector('.emo').textContent = state.sound ? '🔊' : '🔇';
  }

  /* ---------- sizing: the field is the biggest square that fits ---------- */
  function layout() {
    const size = Math.max(240, Math.min(board.clientWidth, board.clientHeight - 10, 640));
    field.style.setProperty('--field', Math.floor(size) + 'px');
  }
  new ResizeObserver(layout).observe(board);

  /* ---------- confetti ---------- */
  const startConfetti = () => Kit.confetti.start();
  const stopConfetti = () => Kit.confetti.stop();

  newGame();
})();
</script>
</body>
</html>
