<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ㄅㄆㄇ配對</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ㄅㄆㄇ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd34e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
  /* Layout: same sunny play mat; toolbar, a big question card, a row of answer cards, and a tray of answered questions. */
  :root {
    --sun: #ffd34e;
    --sun-deep: #f5b82e;
    --cobalt: #2b59c3;
    --cobalt-deep: #1c3f94;
    --paper: #ffffff;
    --ink: #1e2a4a;
    --leaf: #2fb36f;
    --coral: #ff6b5b;
    --font-display: "Baloo 2", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-zhuyin: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--sun);
    background-image: radial-gradient(var(--sun-deep) 2px, transparent 2.5px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; }
  a.chip { color: inherit; text-decoration: none; }
  button:focus-visible, a:focus-visible { outline: 4px solid var(--cobalt); outline-offset: 3px; }

  .app { height: 100%; display: flex; flex-direction: column; gap: 12px; padding-block: 12px; }

  /* ---------- toolbar (shared look) ---------- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .brand {
    font-family: var(--font-display); font-weight: 900; font-size: clamp(1.6rem, 4vw, 2.3rem);
    line-height: 1; margin: 0 auto 0 0; color: var(--cobalt-deep); letter-spacing: 0.04em;
    text-shadow: 3px 3px 0 var(--paper);
  }
  .group { display: flex; gap: 8px; }
  .chip {
    min-width: 60px; height: 60px; padding: 0 12px; border: 0; border-radius: 18px;
    background: var(--paper); box-shadow: 0 5px 0 var(--sun-deep); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .12s, box-shadow .12s;
  }
  .chip:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sun-deep); }
  .chip[aria-pressed="true"] { background: var(--cobalt); color: var(--paper); box-shadow: 0 5px 0 var(--cobalt-deep); }
  .chip .emo { font-family: var(--emoji); font-size: 2rem; line-height: 1; }
  .chip .zy { font-family: var(--font-zhuyin); font-weight: 900; font-size: 1.5rem; line-height: 1; }
  .chip .txt { font-weight: 700; font-size: 1rem; }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

  /* ---------- question & answers ---------- */
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(16px, 4vh, 40px); }
  .question {
    width: var(--q); height: var(--q); border: 0; padding: 0; cursor: pointer;
    border-radius: 28%; background: var(--paper); box-shadow: 0 8px 0 var(--cobalt-deep), 0 0 0 6px var(--cobalt);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2%;
  }
  .question .emo { font-family: var(--emoji); font-size: calc(var(--q) * 0.5); line-height: 1.05; }
  .question .word { font-weight: 900; font-size: calc(var(--q) * 0.14); letter-spacing: .1em; }
  .question .zy { font-family: var(--font-zhuyin); font-weight: 900; font-size: calc(var(--q) * 0.5); line-height: 1.1; color: var(--cobalt-deep); }
  .question .speak { font-family: var(--emoji); font-size: calc(var(--q) * 0.1); opacity: .6; }
  .question.right { animation: hop .5s ease; box-shadow: 0 8px 0 #1f8a52, 0 0 0 6px var(--leaf); }

  .answers { display: flex; gap: var(--agap, 18px); justify-content: center; flex-wrap: wrap; }
  .answer {
    width: var(--a); height: var(--a); border: 0; padding: 0; cursor: pointer;
    border-radius: 24%; background: var(--paper); box-shadow: 0 6px 0 var(--sun-deep);
    display: grid; place-items: center; transition: transform .12s, opacity .2s;
  }
  .answer:active { transform: translateY(4px); }
  .answer .zy { font-family: var(--font-zhuyin); font-weight: 900; font-size: calc(var(--a) * 0.6); line-height: 1; color: var(--cobalt-deep); }
  .answer .emo { font-family: var(--emoji); font-size: calc(var(--a) * 0.6); line-height: 1; }
  .answer.nope { animation: wiggle .4s ease; opacity: .35; cursor: default; }
  .answer.right { background: var(--leaf); box-shadow: 0 6px 0 #1f8a52; animation: hop .5s ease; }
  .answer.right .zy { color: var(--paper); }
  @keyframes wiggle { 0%,100% { rotate: 0deg; } 25% { rotate: -10deg; } 75% { rotate: 10deg; } }
  @keyframes hop { 0%,100% { translate: 0 0; } 40% { translate: 0 -14px; } }

  /* ---------- progress tray ---------- */
  .tray { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
  .slot {
    width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.55);
    border: 3px dashed var(--sun-deep); display: grid; place-items: center;
    font-family: var(--font-zhuyin); font-weight: 900; font-size: 1.4rem; color: var(--cobalt-deep);
  }
  .slot.full { background: var(--paper); border: 3px solid var(--leaf); animation: pop .4s ease; }
  @keyframes pop { 0% { scale: .4; } 70% { scale: 1.15; } 100% { scale: 1; } }

  /* ---------- win panel ---------- */
  .win {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    background: rgba(30, 42, 74, .45);
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  }
  .panel {
    background: var(--paper); border-radius: 32px; padding: 28px 32px; text-align: center;
    box-shadow: 0 10px 0 var(--cobalt-deep); max-width: 420px; width: 100%; animation: pop .5s ease;
  }
  .panel .big { font-family: var(--emoji); font-size: 4.5rem; line-height: 1; }
  .panel h2 { font-family: var(--font-display); font-weight: 900; font-size: 2.2rem; margin: 8px 0 4px; color: var(--cobalt-deep); text-wrap: balance; }
  .stars { font-family: var(--emoji); font-size: 2.6rem; letter-spacing: 6px; margin: 4px 0 18px; }
  .stars .dim { filter: grayscale(1); opacity: .3; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    height: 64px; padding: 0 26px; border: 0; border-radius: 20px; cursor: pointer;
    font-weight: 900; font-size: 1.3rem; background: var(--cobalt); color: var(--paper);
    box-shadow: 0 6px 0 var(--cobalt-deep);
  }
  .btn.alt { background: var(--coral); box-shadow: 0 6px 0 #d4483a; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--cobalt-deep); }
  canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 6; }

  @media (max-width: 1100px) { .chip .txt { display: none; } }
  @media (max-width: 560px) {
    .chip { min-width: 52px; height: 52px; }
    .slot { width: 36px; height: 36px; font-size: 1.1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .answer.nope, .answer.right, .question.right, .slot.full, .panel { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="chip" href="../" aria-label="回遊戲選單"><span class="emo">🏠</span></a>
    <h1 class="brand">ㄅㄆㄇ配對</h1>
    <div class="group" id="modes" role="group" aria-label="選擇模式"></div>
    <div class="group" id="levels" role="group" aria-label="選擇難度"></div>
    <div class="group">
      <button class="chip" id="sound" aria-pressed="true" aria-label="聲音開關"><span class="emo">🔊</span></button>
      <button class="chip" id="restart" aria-label="重新開始"><span class="emo">🔄</span></button>
    </div>
  </header>
  <main class="stage" id="stage">
    <button class="question" id="question" aria-label="題目，點一下再聽一次"></button>
    <div class="answers" id="answers" role="group" aria-label="答案"></div>
  </main>
  <footer class="tray" id="tray" aria-label="答對的題目"></footer>
</div>

<div class="win" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="big">🎉</div>
    <h2 id="winTitle">好棒！全部答對了！</h2>
    <div class="stars" id="stars"></div>
    <div class="actions">
      <button class="btn" id="again">再玩一次</button>
      <button class="btn alt" id="next">下一關 ➜</button>
    </div>
  </div>
</div>

<script>
(() => {
  // Each initial with something a 5-year-old knows whose name starts with it.
  const WORDS = [
    ['ㄅ', '🍪', '餅乾'], ['ㄆ', '🍇', '葡萄'], ['ㄇ', '🐴', '馬'],     ['ㄈ', '✈️', '飛機'],
    ['ㄉ', '🐘', '大象'], ['ㄊ', '🐰', '兔子'], ['ㄋ', '🐮', '牛'],     ['ㄌ', '🐯', '老虎'],
    ['ㄍ', '🐶', '狗'],   ['ㄎ', '🦖', '恐龍'], ['ㄏ', '🐵', '猴子'],   ['ㄐ', '🐔', '雞'],
    ['ㄑ', '🐧', '企鵝'], ['ㄒ', '🍉', '西瓜'], ['ㄓ', '🐷', '豬'],     ['ㄔ', '🚢', '船'],
    ['ㄕ', '🦁', '獅子'], ['ㄖ', '🍖', '肉'],   ['ㄗ', '👄', '嘴巴'],   ['ㄘ', '🍓', '草莓'],
    ['ㄙ', '☂️', '傘'],
  ].map(([zy, emoji, word]) => ({ zy, emoji, word }));

  const MODES = {
    pic: { label: '看圖找注音', icon: '<span class="emo">🍇</span>' },
    zy:  { label: '看注音找圖', icon: '<span class="zy">ㄆ</span>' },
  };
  const LEVELS = [
    { label: '簡單', pool: 8,  options: 3 },  // ㄅ–ㄌ
    { label: '普通', pool: 14, options: 3 },  // ㄅ–ㄒ
    { label: '挑戰', pool: 21, options: 4 },  // ㄅ–ㄙ
  ];
  const ROUND = 8;

  const $ = id => document.getElementById(id);
  const stage = $('stage'), qEl = $('question'), answersEl = $('answers'), tray = $('tray');
  const store = {
    get(k, d) { try { const v = localStorage.getItem('zhuyin.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('zhuyin.' + k, JSON.stringify(v)); } catch {} },
  };
  const state = {
    mode: MODES[store.get('mode', 'pic')] ? store.get('mode', 'pic') : 'pic',
    level: Math.min(LEVELS.length - 1, Math.max(0, store.get('level', 0) | 0)),
    sound: store.get('sound', true) !== false,
    queue: [], current: null, done: 0, wrong: 0, lock: false,
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  /* ---------- sound ---------- */
  let ctx = null;
  function audio() {
    if (!state.sound) return null;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch { return null; }
  }
  function tone(freq, start, dur, type = 'sine', vol = 0.18) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    right: () => [523, 659, 784].forEach((f, i) => tone(f, i * 0.09, 0.3)),
    miss: () => { tone(330, 0, 0.18, 'sine', 0.1); tone(294, 0.12, 0.22, 'sine', 0.1); },
    win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.35, 'triangle', 0.15)),
  };
  function say(text) {
    if (!state.sound || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW'; u.rate = 0.85; u.pitch = 1.2;
      const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch {}
  }

  /* ---------- rounds ---------- */
  function newGame() {
    $('win').hidden = true; stopConfetti();
    const pool = WORDS.slice(0, LEVELS[state.level].pool);
    Object.assign(state, { queue: shuffle([...pool]).slice(0, ROUND), done: 0, wrong: 0, lock: false });
    tray.innerHTML = '';
    for (let i = 0; i < ROUND; i++) { const s = document.createElement('div'); s.className = 'slot'; tray.append(s); }
    syncToolbar();
    ask();
  }

  function ask() {
    const lv = LEVELS[state.level];
    const q = state.current = state.queue[state.done];
    const pool = WORDS.slice(0, lv.pool).filter(w => w !== q);
    const options = shuffle([q, ...shuffle(pool).slice(0, lv.options - 1)]);

    qEl.classList.remove('right');
    if (state.mode === 'pic') {
      qEl.innerHTML = `<span class="emo">${q.emoji}</span><span class="word">${q.word}</span><span class="speak">🔈</span>`;
      qEl.setAttribute('aria-label', `${q.word}，點一下再聽一次`);
    } else {
      qEl.innerHTML = `<span class="zy">${q.zy}</span><span class="speak">🔈</span>`;
      qEl.setAttribute('aria-label', `${q.zy}，點一下再聽一次`);
    }
    answersEl.innerHTML = '';
    for (const o of options) {
      const b = document.createElement('button');
      b.className = 'answer';
      b.innerHTML = state.mode === 'pic' ? `<span class="zy">${o.zy}</span>` : `<span class="emo">${o.emoji}</span>`;
      b.setAttribute('aria-label', state.mode === 'pic' ? o.zy : o.word);
      b.addEventListener('click', () => answer(o, b));
      answersEl.append(b);
    }
    layout();
    prompt();
  }
  function prompt() {
    const q = state.current;
    say(state.mode === 'pic' ? `${q.word}，是哪一個注音？` : `${q.zy}，找一找，哪一個是${q.zy}開頭？`);
  }
  qEl.addEventListener('click', () => { audio(); prompt(); });

  function answer(o, btn) {
    if (state.lock || btn.classList.contains('nope')) return;
    audio();
    const q = state.current;
    if (o === q) {
      state.lock = true;
      btn.classList.add('right'); qEl.classList.add('right'); sfx.right();
      say(`${q.zy}，${q.word}`);
      const slot = tray.children[state.done]; slot.textContent = q.zy; slot.classList.add('full');
      state.done++;
      setTimeout(() => {
        state.lock = false;
        if (state.done >= ROUND) win(); else ask();
      }, 1700);
    } else {
      // A wrong pick fades out, so the right answer is always found in the end.
      state.wrong++;
      btn.classList.add('nope'); btn.setAttribute('aria-disabled', 'true'); sfx.miss();
      say(state.mode === 'pic' ? `這是${o.zy}，再試試看` : `這是${o.word}，再試試看`);
    }
  }

  function win() {
    const stars = state.wrong <= 2 ? 3 : 2; // always encouraging: at least 2 stars
    $('stars').innerHTML = [0, 1, 2].map(i => i < stars ? '⭐' : '<span class="dim">⭐</span>').join('');
    $('next').hidden = state.level >= LEVELS.length - 1;
    $('win').hidden = false;
    sfx.win(); say('好棒！全部答對了！');
    startConfetti();
    $('again').focus();
  }
  $('again').addEventListener('click', newGame);
  $('next').addEventListener('click', () => {
    state.level = Math.min(LEVELS.length - 1, state.level + 1); store.set('level', state.level); newGame();
  });

  /* ---------- toolbar ---------- */
  for (const [key, m] of Object.entries(MODES)) {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.key = key; b.setAttribute('aria-label', m.label);
    b.innerHTML = `${m.icon}<span class="txt">${m.label}</span>`;
    b.addEventListener('click', () => { state.mode = key; store.set('mode', key); newGame(); });
    $('modes').append(b);
  }
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.setAttribute('aria-label', lv.label);
    b.innerHTML = `<span class="dots">${'<i></i>'.repeat(i + 1)}</span><span class="txt">${lv.label}</span>`;
    b.addEventListener('click', () => { state.level = i; store.set('level', i); newGame(); });
    $('levels').append(b);
  });
  $('sound').addEventListener('click', () => {
    state.sound = !state.sound; store.set('sound', state.sound);
    if (!state.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
    syncToolbar();
  });
  $('restart').addEventListener('click', newGame);
  function syncToolbar() {
    [...$('modes').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.key === state.mode));
    [...$('levels').children].forEach((b, i) => b.setAttribute('aria-pressed', i === state.level));
    $('sound').setAttribute('aria-pressed', state.sound);
    $('sound').querySelector('.emo').textContent = state.sound ? '🔊' : '🔇';
  }

  /* ---------- sizing ---------- */
  function layout() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const n = Math.max(1, answersEl.children.length);
    const gap = Math.max(12, Math.min(24, Math.round(W / 40)));
    const a = Math.floor(Math.max(70, Math.min(170, (W - gap * (n - 1)) / n, H * 0.32)));
    const q = Math.floor(Math.max(120, Math.min(300, H - a - Math.min(40, H * 0.06) - 20, W * 0.7)));
    stage.style.setProperty('--a', a + 'px'); stage.style.setProperty('--q', q + 'px'); stage.style.setProperty('--agap', gap + 'px');
  }
  new ResizeObserver(layout).observe(stage);

  /* ---------- confetti ---------- */
  let confettiRaf = 0, confettiCanvas = null;
  function startConfetti() {
    if (reduceMotion) return;
    stopConfetti();
    const c = confettiCanvas = document.createElement('canvas');
    c.className = 'confetti'; document.body.append(c);
    const dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    const g = c.getContext('2d'); g.scale(dpr, dpr);
    const colors = ['#2b59c3', '#ff6b5b', '#2fb36f', '#ffd34e', '#a463f2'];
    const bits = Array.from({ length: 140 }, () => ({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6,
      vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2,
      w: 8 + Math.random() * 8, h: 5 + Math.random() * 6, color: colors[Math.floor(Math.random() * colors.length)],
    }));
    const t0 = performance.now();
    (function frame(now) {
      g.clearRect(0, 0, innerWidth, innerHeight);
      for (const b of bits) {
        b.x += b.vx; b.y += b.vy; b.r += b.vr;
        g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.fillStyle = b.color;
        g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); g.restore();
      }
      if (now - t0 < 4500) confettiRaf = requestAnimationFrame(frame); else stopConfetti();
    })(t0);
  }
  function stopConfetti() {
    cancelAnimationFrame(confettiRaf);
    if (confettiCanvas) { confettiCanvas.remove(); confettiCanvas = null; }
  }

  newGame();
})();
</script>
</body>
</html>
