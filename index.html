<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小小遊戲屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小小遊戲屋">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd34e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
  /* Layout: the same sunny play mat as the games; a big title, then a grid of large game tiles a child can tap. */
  :root {
    --sun: #ffd34e;
    --sun-deep: #f5b82e;
    --cobalt: #2b59c3;
    --cobalt-deep: #1c3f94;
    --paper: #ffffff;
    --ink: #1e2a4a;
    --grass: #5cbf5a;
    --grass-deep: #3f9a43;
    --dirt: #6b4426;
    --font-display: "Baloo 2", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { min-height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background-color: var(--sun);
    background-image: radial-gradient(var(--sun-deep) 2px, transparent 2.5px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding-block: 32px 48px; display: grid; gap: 28px; }
  header { text-align: center; }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 900; line-height: 1.1;
    font-size: clamp(2.4rem, 7vw, 3.6rem); color: var(--cobalt-deep); letter-spacing: 0.06em;
    text-shadow: 4px 4px 0 var(--paper); text-wrap: balance;
  }
  header p { margin: 8px 0 0; font-weight: 700; font-size: 1.15rem; }

  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 24px; }
  .tile {
    display: grid; grid-template-rows: auto 1fr; border-radius: 28px; overflow: hidden;
    background: var(--paper); color: inherit; text-decoration: none;
    box-shadow: 0 8px 0 var(--sun-deep); transition: transform .12s, box-shadow .12s;
  }
  a.tile:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--sun-deep); }
  a.tile:focus-visible { outline: 5px solid var(--cobalt); outline-offset: 4px; }
  .art {
    aspect-ratio: 4 / 3; max-width: 100%; background: var(--cobalt);
    background-image: radial-gradient(rgba(255,255,255,.18) 3px, transparent 3.5px);
    background-size: 18px 18px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .mini {
    width: 34%; aspect-ratio: 1; border-radius: 16%; border: 4px solid var(--paper);
    display: grid; place-items: center; box-shadow: 0 5px 0 var(--cobalt-deep);
  }
  .mini.back { background: var(--cobalt-deep); color: var(--sun); font-size: 2.4rem; transform: rotate(-8deg); }
  .mini.front { background: var(--paper); font-family: var(--emoji); font-size: 2.8rem; transform: rotate(6deg); }
  .info { padding: 16px 20px 20px; display: grid; gap: 4px; }
  .name { font-family: var(--font-display); font-weight: 900; font-size: 1.8rem; line-height: 1.2; }
  .desc { font-weight: 700; font-size: 1rem; opacity: .75; }

  .art.grass { background-color: var(--grass); background-image: radial-gradient(var(--grass-deep) 2px, transparent 2.5px); background-size: 18px 18px; flex-direction: column; gap: 0; }
  .art.grass .peek { font-family: var(--emoji); font-size: 4.2rem; line-height: 1; margin-bottom: -6px; position: relative; }
  .art.grass .hole { width: 46%; height: 18%; border-radius: 50%; background: var(--dirt); }
  .art.shelf { background: var(--paper); border-bottom: 3px dashed var(--sun-deep); gap: 6%; }
  .mb { width: 22%; display: flex; flex-direction: column; align-items: center; }
  .mb .e { font-family: var(--emoji); font-size: 2.6rem; line-height: 1; margin-bottom: -6px; position: relative; }
  .mb .r { width: 100%; height: 10px; border-radius: 5px; background: var(--d); }
  .mb .b { width: 84%; height: 44px; border-radius: 0 0 40% 40%; background: var(--c); }
  .art.jigsaw { background: #ffe9b8; }
  .jig { width: 46%; aspect-ratio: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; rotate: -5deg; }
  .jig i { border-radius: 10px; background: var(--c); border: 4px solid var(--paper); box-shadow: 0 4px 0 var(--sun-deep); display: grid; place-items: center; font-style: normal; font-family: var(--emoji); font-size: 2rem; }
  .jig i.out { translate: 22px 14px; rotate: 12deg; }
  .art.orchard { background: #bfe9ff; position: relative; flex-direction: column; gap: 0; }
  .art.orchard::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: var(--grass); }
  .art.orchard .f { font-family: var(--emoji); font-size: 2.6rem; line-height: 1; }
  .art.orchard .k { font-family: var(--emoji); font-size: 4.4rem; line-height: 1; position: relative; z-index: 1; margin-top: 6px; }
  .art.hole { background: #7ccf6a; position: relative; }
  .art.match { background: #fff7dc; }
  .m3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 58%; }
  .m3 i { aspect-ratio: 1; border-radius: 22%; background: var(--t); display: grid; place-items: center; font-style: normal; font-family: var(--emoji); font-size: 1.5rem; }
  .m3 i.on { box-shadow: inset 0 0 0 3px var(--leaf); }
  .art.hole .pit { width: 46%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 58%, #05060a 0 30%, #141826 70%, #2d3448); box-shadow: inset 0 0 0 4px rgba(255,255,255,.35); display: grid; place-items: center; font-family: var(--emoji); font-size: 1.6rem; }
  .art.hole .pit span { rotate: 30deg; scale: .8; }
  .art.hole .near { position: absolute; font-family: var(--emoji); line-height: 1; }
  .art.zy { background: var(--paper); border-bottom: 3px dashed var(--sun-deep); gap: 10px; }
  .art.zy .card { width: 30%; aspect-ratio: 1; border-radius: 24%; display: grid; place-items: center; box-shadow: 0 5px 0 var(--sun-deep), 0 0 0 4px var(--cobalt); }
  .art.zy .card.z { font-weight: 900; font-size: 3.2rem; color: var(--cobalt-deep); }
  .art.zy .card.p { font-family: var(--emoji); font-size: 3rem; }
  .art.zy .eq { font-weight: 900; font-size: 2rem; color: var(--cobalt-deep); }

  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小小遊戲屋</h1>
    <p>點一下，開始玩！</p>
  </header>
  <main class="games">
    <a class="tile" href="memory/">
      <div class="art" aria-hidden="true"><span class="mini back">★</span><span class="mini front">🐶</span></div>
      <div class="info"><span class="name">翻翻樂</span><span class="desc">翻開卡片，找出一樣的</span></div>
    </a>
    <a class="tile" href="whack/">
      <div class="art grass" aria-hidden="true"><span class="peek">🐹</span><span class="hole"></span></div>
      <div class="info"><span class="name">敲敲地鼠</span><span class="desc">地鼠跑出來，快敲一下</span></div>
    </a>
    <a class="tile" href="colors/">
      <div class="art shelf" aria-hidden="true">
        <span class="mb" style="--c:#e94848;--d:#b92f2f"><span class="e">🍎</span><span class="r"></span><span class="b"></span></span>
        <span class="mb" style="--c:#ffc21a;--d:#d99a00"><span class="e">🍌</span><span class="r"></span><span class="b"></span></span>
        <span class="mb" style="--c:#2f7fe0;--d:#1f5bab"><span class="e">🐳</span><span class="r"></span><span class="b"></span></span>
      </div>
      <div class="info"><span class="name">顏色小籃子</span><span class="desc">把東西放進一樣顏色的籃子</span></div>
    </a>
    <a class="tile" href="puzzle/">
      <div class="art jigsaw" aria-hidden="true">
        <span class="jig"><i style="--c:#ffb35c">🦁</i><i style="--c:#ffe08a"></i><i style="--c:#e3a64a"></i><i class="out" style="--c:#ffcf7a"></i></span>
      </div>
      <div class="info"><span class="name">拼拼樂</span><span class="desc">把拼圖片放回原位</span></div>
    </a>
    <a class="tile" href="catch/">
      <div class="art orchard" aria-hidden="true"><span class="f">🍎</span><span class="k">🧺</span></div>
      <div class="info"><span class="name">接水果</span><span class="desc">移動籃子，接住掉下來的水果</span></div>
    </a>
    <a class="tile" href="zhuyin/">
      <div class="art zy" aria-hidden="true"><span class="card z">ㄆ</span><span class="eq">＝</span><span class="card p">🍇</span></div>
      <div class="info"><span class="name">ㄅㄆㄇ配對</span><span class="desc">看圖找注音，認識聲母</span></div>
    </a>
    <a class="tile" href="hole/">
      <div class="art hole" aria-hidden="true"><span class="near" style="left:12%;top:14%;font-size:1.8rem">🌸</span><span class="near" style="right:10%;top:10%;font-size:2.8rem">🏠</span><span class="near" style="right:16%;bottom:10%;font-size:2rem">🚗</span><span class="pit"><span>🍎</span></span></div>
      <div class="info"><span class="name">洞洞吃光光</span><span class="desc">拖著洞洞，把東西吃光光</span></div>
    </a>
    <a class="tile" href="match/">
      <div class="art match" aria-hidden="true"><span class="m3"><i style="--t:#ffd3d3">🍎</i><i style="--t:#e8d6ff">🍇</i><i style="--t:#d3f3c4">🍏</i><i class="on" style="--t:#fff1a6">🍋</i><i class="on" style="--t:#fff1a6">🍋</i><i class="on" style="--t:#fff1a6">🍋</i><i style="--t:#d2defc">🫐</i><i style="--t:#ffd3d3">🍎</i><i style="--t:#e8d6ff">🍇</i></span></div>
      <div class="info"><span class="name">消消樂</span><span class="desc">三個一樣排一排，消掉它</span></div>
    </a>
  </main>
</div>
</body>
</html>
