<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>洞洞吃光光</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="洞洞">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd34e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
  /* Layout: same sunny play mat; toolbar, a top-down map canvas where the hole roams, and a progress bar of how much is eaten. */
  :root {
    --sun: #ffd34e;
    --sun-deep: #f5b82e;
    --cobalt: #2b59c3;
    --cobalt-deep: #1c3f94;
    --paper: #ffffff;
    --ink: #1e2a4a;
    --leaf: #2fb36f;
    --coral: #ff6b5b;
    --font-display: "Baloo 2", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--sun);
    background-image: radial-gradient(var(--sun-deep) 2px, transparent 2.5px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; }
  a.chip { color: inherit; text-decoration: none; }
  button:focus-visible, a:focus-visible { outline: 4px solid var(--cobalt); outline-offset: 3px; }

  .app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; }

  /* ---------- toolbar (shared look) ---------- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .brand {
    font-family: var(--font-display); font-weight: 900; font-size: clamp(1.6rem, 4vw, 2.3rem);
    line-height: 1; margin: 0 auto 0 0; color: var(--cobalt-deep); letter-spacing: 0.04em;
    text-shadow: 3px 3px 0 var(--paper);
  }
  .group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-width: 60px; height: 60px; padding: 0 12px; border: 0; border-radius: 18px;
    background: var(--paper); box-shadow: 0 5px 0 var(--sun-deep); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .12s, box-shadow .12s;
  }
  .chip:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sun-deep); }
  .chip[aria-pressed="true"] { background: var(--cobalt); color: var(--paper); box-shadow: 0 5px 0 var(--cobalt-deep); }
  .chip .emo { font-family: var(--emoji); font-size: 2rem; line-height: 1; }
  .chip .txt { font-weight: 700; font-size: 1rem; }
  .sz { display: inline-grid; place-items: center; width: 30px; height: 30px; }
  .sz i { display: block; border: 3px solid currentColor; border-radius: 5px; }

  /* ---------- map ---------- */
  .stage {
    flex: 1; min-height: 0; position: relative; border-radius: 28px; overflow: hidden;
    box-shadow: 0 8px 0 var(--sun-deep); touch-action: none; background: #7ccf6a;
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .toast {
    position: absolute; left: 50%; top: 16px; translate: -50% 0; z-index: 3; pointer-events: none;
    padding: 8px 22px; border-radius: 999px; background: var(--paper); box-shadow: 0 5px 0 var(--sun-deep);
    font-weight: 900; font-size: 1.3rem; white-space: nowrap; animation: toast 2.2s ease forwards;
  }
  .toast .emo { font-family: var(--emoji); }
  @keyframes toast { 0% { opacity: 0; translate: -50% -20px; } 12%, 80% { opacity: 1; translate: -50% 0; } 100% { opacity: 0; translate: -50% -10px; } }
  .start { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; pointer-events: none; }
  .start button {
    pointer-events: auto; width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--paper);
    background: var(--coral); color: var(--paper); box-shadow: 0 8px 0 #d4483a; cursor: pointer;
    font-weight: 900; font-size: 1.4rem; display: grid; place-content: center; gap: 2px;
    animation: breathe 1.6s ease-in-out infinite;
  }
  .start button .play { font-size: 3.4rem; line-height: 1; translate: 6% 0; }
  .start button:active { transform: translateY(6px); box-shadow: 0 2px 0 #d4483a; }
  @keyframes breathe { 50% { scale: 1.06; } }

  /* ---------- progress ---------- */
  .progress { display: flex; align-items: center; gap: 12px; padding-inline: 4px; }
  .track { flex: 1; height: 22px; border-radius: 999px; background: rgba(255,255,255,.6); box-shadow: inset 0 2px 0 rgba(0,0,0,.08); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 999px; background: var(--leaf); transition: width .3s ease; }
  .recent { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; min-width: 15.5rem; height: 2.4rem; align-items: center; font-family: var(--emoji); font-size: 1.8rem; line-height: 1; }
  .recent span { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--paper); box-shadow: 0 3px 0 var(--sun-deep); animation: pop .4s ease; }
  .recent span:not(:last-child) { opacity: .75; scale: .85; }
  .count { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
  .count .emo { font-family: var(--emoji); }

  /* ---------- win panel ---------- */
  .win {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    background: rgba(30, 42, 74, .45);
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  }
  .panel {
    background: var(--paper); border-radius: 32px; padding: 28px 32px; text-align: center;
    box-shadow: 0 10px 0 var(--cobalt-deep); max-width: 420px; width: 100%; animation: pop .5s ease;
  }
  .panel .big { font-family: var(--emoji); font-size: 4.5rem; line-height: 1; }
  .panel h2 { font-family: var(--font-display); font-weight: 900; font-size: 2.2rem; margin: 8px 0 4px; color: var(--cobalt-deep); text-wrap: balance; }
  .stars { font-family: var(--emoji); font-size: 2.6rem; letter-spacing: 6px; margin: 4px 0 18px; }
  .stars .dim { filter: grayscale(1); opacity: .3; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    height: 64px; padding: 0 26px; border: 0; border-radius: 20px; cursor: pointer;
    font-weight: 900; font-size: 1.3rem; background: var(--cobalt); color: var(--paper);
    box-shadow: 0 6px 0 var(--cobalt-deep);
  }
  .btn.alt { background: var(--coral); box-shadow: 0 6px 0 #d4483a; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--cobalt-deep); }
  @keyframes pop { 0% { scale: .4; } 70% { scale: 1.1; } 100% { scale: 1; } }
  canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 6; }

  @media (max-width: 1180px) {
    .chip .txt { display: none; }
    .chip { min-width: 56px; height: 56px; padding: 0 8px; }
    .chip .emo { font-size: 1.8rem; }
    .bar { gap: 8px 12px; }
  }
  @media (max-width: 560px) {
    .recent { min-width: 0; font-size: 1.2rem; height: 1.8rem; }
    .recent span { width: 1.8rem; height: 1.8rem; }
    .recent span:nth-last-child(n+4) { display: none; }   /* keep the 3 newest */
    .chip { min-width: 46px; height: 46px; padding: 0 8px; border-radius: 14px; }
    .chip .emo { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .recent span { animation: none; }
    .panel, .start button, .toast { animation: none; }
    .fill { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="chip" href="../" aria-label="回遊戲選單"><span class="emo">🏠</span></a>
    <h1 class="brand">洞洞吃光光</h1>
    <div class="group" id="maps" role="group" aria-label="選擇場景"></div>
    <div class="group" id="sizes" role="group" aria-label="選擇地圖大小"></div>
    <div class="group">
      <button class="chip" id="sound" aria-pressed="true" aria-label="聲音開關"><span class="emo">🔊</span></button>
      <button class="chip" id="restart" aria-label="重新開始"><span class="emo">🔄</span></button>
    </div>
  </header>
  <main class="stage" id="stage" aria-label="地圖：按住畫面任何地方，往想去的方向滑動，洞洞就會移動；小地圖在右上角">
    <canvas id="cv"></canvas>
    <div class="start" id="start"><button id="go" aria-label="開始"><span class="play">▶</span><span id="goText">開始</span></button></div>
  </main>
  <footer class="progress">
    <div class="recent" id="recent" aria-label="剛剛吃到的東西" aria-live="polite"></div>
    <div class="track" role="progressbar" aria-label="吃掉的東西" aria-valuemin="0" id="track"><div class="fill" id="fill"></div></div>
    <div class="count" id="count"></div>
  </footer>
</div>

<div class="win" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="big">🕳️</div>
    <h2 id="winTitle">全部吃光光了！</h2>
    <div class="stars" id="stars"></div>
    <div class="actions">
      <button class="btn" id="again">再玩一次</button>
      <button class="btn alt" id="next">下一個地方 ➜</button>
    </div>
  </div>
</div>

<script>
(() => {
  /* All positions and sizes are in map units: 1 unit = the screen's shorter side at normal zoom.
     The world is twice the screen in each direction; the camera follows the hole and zooms out as it grows. */
  const TIER_SIZE  = [0.05, 0.075, 0.11, 0.16, 0.22];
  const MAPS = {
    park: { label: '公園', icon: '🌳', tiers: [
      [['🌸','花'],['🍎','蘋果'],['🍄','香菇'],['🌼','小花'],['🍓','草莓'],['🦋','蝴蝶']],
      [['🐶','小狗'],['🐱','小貓'],['🚲','腳踏車'],['⚽','足球'],['🐰','兔子']],
      [['🌳','大樹'],['🌲','松樹'],['🐴','小馬']],
      [['⛲','噴水池'],['🎠','旋轉木馬'],['🚌','公車']],
      [['🎡','摩天輪'],['🏰','城堡']] ] },
    city: { label: '城市', icon: '🏙️', tiers: [
      [['🍦','冰淇淋'],['🧃','果汁'],['📮','郵筒'],['🌷','鬱金香'],['🛴','滑板車'],['🚥','紅綠燈']],
      [['🚲','腳踏車'],['🛵','機車'],['🐕','小狗'],['🌲','樹']],
      [['🚗','汽車'],['🚕','計程車'],['🚓','警車']],
      [['🚌','公車'],['🚒','消防車'],['🏠','房子']],
      [['🏢','大樓'],['🏬','百貨公司']] ] },
    farm: { label: '農場', icon: '🐮', tiers: [
      [['🥕','紅蘿蔔'],['🌽','玉米'],['🥚','蛋'],['🍅','番茄'],['🌻','向日葵'],['🐤','小雞']],
      [['🐔','母雞'],['🐇','兔子'],['🐑','綿羊'],['🎃','南瓜']],
      [['🐷','小豬'],['🐐','山羊'],['🌳','大樹']],
      [['🐄','乳牛'],['🚜','拖拉機'],['🐎','馬']],
      [['🏡','農舍'],['🏘️','村莊']] ] },
    beach: { label: '海邊', icon: '🏖️', tiers: [
      [['🐚','貝殼'],['🦀','螃蟹'],['🍦','冰淇淋'],['🦐','蝦子'],['🐠','小魚'],['🍹','果汁']],
      [['🐢','海龜'],['🏐','排球'],['⛱️','陽傘'],['🐙','章魚']],
      [['🛶','獨木舟'],['🐬','海豚'],['🦈','鯊魚']],
      [['⛵','帆船'],['🐋','鯨魚'],['🚤','快艇']],
      [['🛳️','郵輪'],['🏝️','小島']] ] },
    space: { label: '太空', icon: '🚀', tiers: [
      [['⭐','星星'],['🌟','亮星星'],['🌙','月亮'],['👽','外星人'],['✨','星光']],
      [['🛰️','衛星'],['👾','小怪獸'],['🛸','飛碟'],['🔭','望遠鏡']],
      [['🚀','火箭'],['🌕','月球'],['☄️','彗星']],
      [['🪐','土星'],['🌎','地球'],['🌍','地球']],
      [['🌞','太陽'],['🌌','銀河']] ] },
    dino: { label: '恐龍', icon: '🦖', tiers: [
      [['🥚','恐龍蛋'],['🍃','葉子'],['🦴','骨頭'],['🍄','香菇'],['🐞','瓢蟲'],['🐌','蝸牛']],
      [['🦎','蜥蜴'],['🐢','烏龜'],['🌵','仙人掌'],['🐍','蛇']],
      [['🐊','鱷魚'],['🌴','椰子樹'],['🌳','大樹']],
      [['🦕','雷龍'],['🦖','暴龍'],['🦕','長脖子恐龍']],
      [['🌋','火山'],['⛰️','大山']] ] },
  };
  const MAP_KEYS = Object.keys(MAPS);
  // Small: the whole map fits on one screen. Big: 2× the screen each way, with a following camera.
  const SIZES = {
    small: { label: '小地圖', world: 1, counts: [12, 9, 6, 4, 2],   grow: 0.5, rmax: 0.25, stars: 150, icon: 14 },
    big:   { label: '大地圖', world: 2, counts: [30, 22, 13, 8, 4], grow: 0.4, rmax: 0.3,  stars: 300, icon: 26 },
  };
  const R0 = 0.045, EAT = 0.8;
  const SPEED = 0.32;   // map units per second with the stick fully pushed: slow enough to watch what gets eaten
  const FALL = 0.65;    // seconds for a thing to tumble into the hole
  const RECENT = 6;     // how many recent eats to show by the progress bar
  const HOLE_ON_SCREEN = 0.17;           // zoom out so the hole never covers more than this
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  const $ = id => document.getElementById(id);
  const stage = $('stage'), cv = $('cv'), g = cv.getContext('2d');
  const store = {
    get(k, d) { try { const v = localStorage.getItem('hole.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('hole.' + k, JSON.stringify(v)); } catch {} },
  };
  const state = {
    map: MAPS[store.get('map', 'park')] ? store.get('map', 'park') : 'park',
    size: SIZES[store.get('size', 'big')] ? store.get('size', 'big') : 'big',
    sound: store.get('sound', true) !== false,
    running: false, items: [], pops: [], deco: null, eaten: 0, total: 0, canEat: 0, elapsed: 0, last: 0, bumpCooldown: 0,
    world: { w: 2.6, h: 2 },
    hole: { x: 1.3, y: 1, r: R0, vx: 0, vy: 0, gulp: 0 },
    cam: { x: 1.3, y: 1, zoom: 1 },
    pointer: { down: false, id: null, x0: 0, y0: 0, sx: 0, sy: 0 },
    W: 0, H: 0, m: 0, dpr: 1,
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];

  /* ---------- sound ---------- */
  let ctx = null;
  function audio() {
    if (!state.sound) return null;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch { return null; }
  }
  function tone(freq, start, dur, type = 'sine', vol = 0.18, slideTo) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + start, o = a.createOscillator(), gn = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    gulp: tier => { const f = 880 / (1 + tier * 0.35); tone(f, 0, 0.22, 'sine', 0.16, f / 2.5); },
    bump: () => tone(220, 0, 0.15, 'triangle', 0.08, 300),
    grow: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.25, 'triangle', 0.13)),
    win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.35, 'triangle', 0.15)),
  };
  function say(text) {
    if (!state.sound || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW'; u.rate = 0.95; u.pitch = 1.2;
      const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch {}
  }
  function toast(html) {
    stage.querySelector('.toast')?.remove();
    const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html;
    stage.append(t); setTimeout(() => t.remove(), 2300);
  }

  /* ---------- world generation ---------- */
  function seeded(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function buildWorld() {
    const { W, H } = state, m = Math.min(W, H) || 1;
    const cfg = SIZES[state.size], ww = cfg.world * (W || 1.3) / m, wh = cfg.world * (H || 1) / m;
    state.world = { w: ww, h: wh };
    const tiers = MAPS[state.map].tiers, items = [];
    // Biggest things first, kept apart, with the starting spot in the middle left clear.
    for (let t = tiers.length - 1; t >= 0; t--) {
      for (let k = 0; k < cfg.counts[t]; k++) {
        const [e, name] = tiers[t][k % tiers[t].length];
        const r = TIER_SIZE[t] / 2;
        for (let tries = 0; tries < 400; tries++) {
          const x = r + Math.random() * (ww - 2 * r), y = r * 1.2 + Math.random() * (wh - 2.4 * r);
          if (Math.hypot(x - ww / 2, y - wh / 2) < r + 0.14) continue;
          if (items.some(o => Math.hypot(o.x - x, o.y - y) < (o.s / 2 + r) * 1.05)) continue;
          items.push({ e, name, tier: t, x, y, s: TIER_SIZE[t], st: 'idle', t: 0, wob: 0 });
          break;
        }
      }
    }
    state.items = items;
    state.deco = buildDeco(ww, wh);
  }

  // Ground decoration for each place, in map units, generated once per round.
  function buildDeco(ww, wh) {
    const r = seeded(MAP_KEYS.indexOf(state.map) * 97 + 13), dots = n => Array.from({ length: n }, () => [r() * ww, r() * wh, 0.004 + r() * 0.006]);
    switch (state.map) {
      case 'park': return { bg: '#7ccf6a', edge: '#5aa84c', dots: dots(380), dot: '#6cbf5c',
        paths: [[[-0.1, wh * 0.7], [ww * 0.3, wh * 0.35], [ww * 0.65, wh * 1.0], [ww + 0.1, wh * 0.3]], [[ww * 0.2, -0.1], [ww * 0.1, wh * 0.4], [ww * 0.5, wh * 0.6], [ww * 0.45, wh + 0.1]]],
        path: '#f1dca7', ponds: [[ww * 0.82, wh * 0.82, 0.16, 0.09], [ww * 0.15, wh * 0.2, 0.12, 0.07]], pond: '#8fd3f5' };
      case 'city': return { bg: '#b9c0c8', edge: '#8d959e', roads: { xs: [ww * 0.2, ww * 0.5, ww * 0.8], ys: [wh * 0.25, wh * 0.55, wh * 0.85], w: 0.09 } };
      case 'farm': return { bg: '#9bd47a', edge: '#78b058', dots: dots(200), dot: '#8cc56a',
        fields: [[ww * 0.05, wh * 0.06, ww * 0.3, wh * 0.3], [ww * 0.6, wh * 0.62, ww * 0.32, wh * 0.3]], yards: [[ww * 0.62, wh * 0.08, ww * 0.3, wh * 0.28], [ww * 0.06, wh * 0.62, ww * 0.3, wh * 0.3]] };
      case 'beach': return { bg: '#f3dc9c', edge: '#d9bd72', dots: dots(300), dot: '#e6c97e', sea: wh * 0.32 };
      case 'space': return { bg: '#1a2350', edge: '#0d1230', stars: Array.from({ length: 420 }, () => [r() * ww, r() * wh, 0.002 + r() * 0.006, 0.4 + r() * 0.6]),
        nebulas: [[ww * 0.25, wh * 0.3, 0.4, '#7a4cc9'], [ww * 0.75, wh * 0.7, 0.45, '#2f7fe0'], [ww * 0.7, wh * 0.2, 0.3, '#d94c9a']] };
      default: return { bg: '#8cc56a', edge: '#6a9f4c', dots: dots(320), dot: '#7ab35a',
        mud: [[ww * 0.3, wh * 0.7, 0.22, 0.12], [ww * 0.7, wh * 0.35, 0.2, 0.1]], lava: [[ww * 0.85, wh * 0.85, 0.12, 0.07], [ww * 0.12, wh * 0.15, 0.1, 0.06]] };
    }
  }

  /* ---------- camera ---------- */
  const ppu = () => state.m * state.cam.zoom;                         // screen pixels per map unit
  const toScreen = (x, y) => [state.W / 2 + (x - state.cam.x) * ppu(), state.H / 2 + (y - state.cam.y) * ppu()];
  const toWorld = (sx, sy) => [state.cam.x + (sx - state.W / 2) / ppu(), state.cam.y + (sy - state.H / 2) / ppu()];
  function fitZoom() { return Math.min(state.W / (state.world.w * state.m), state.H / (state.world.h * state.m)); }
  function clampCam() {
    const c = state.cam, hw = state.W / 2 / ppu(), hh = state.H / 2 / ppu(), w = state.world;
    c.x = w.w <= hw * 2 ? w.w / 2 : Math.max(hw, Math.min(w.w - hw, c.x));
    c.y = w.h <= hh * 2 ? w.h / 2 : Math.max(hh, Math.min(w.h - hh, c.y));
  }
  function updateCamera(dt, snap) {
    const c = state.cam, h = state.hole;
    const targetZoom = Math.max(fitZoom(), Math.min(1, HOLE_ON_SCREEN / h.r));
    const k = snap ? 1 : Math.min(1, dt * 2.5), kz = snap ? 1 : Math.min(1, dt * 1.5);
    c.zoom += (targetZoom - c.zoom) * kz;
    c.x += (h.x - c.x) * k; c.y += (h.y - c.y) * k;
    clampCam();
  }
  function resize() {
    const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    state.W = r.width; state.H = r.height; state.m = Math.min(r.width, r.height); state.dpr = dpr;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    if (state.items.length) { updateCamera(0, true); draw(); }
  }
  new ResizeObserver(resize).observe(stage);

  /* ---------- input: a joystick that appears wherever the finger presses ----------
     Press anywhere, then slide: the hole travels in that direction, faster the further you slide.
     The finger never has to sit on the hole or on the things being eaten. */
  const STICK_DEAD = 10, STICK_FULL = 90;   // px: ignore tiny wiggles; full speed at this distance
  function stagePoint(e) { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || state.pointer.down) return;
    const [x, y] = stagePoint(e);
    Object.assign(state.pointer, { down: true, id: e.pointerId, x0: x, y0: y, sx: x, sy: y });
    try { stage.setPointerCapture(e.pointerId); } catch {}
  });
  stage.addEventListener('pointermove', e => {
    if (!state.pointer.down || e.pointerId !== state.pointer.id) return;
    [state.pointer.sx, state.pointer.sy] = stagePoint(e);
  });
  const lift = e => { if (e.pointerId === state.pointer.id) state.pointer.down = false; };
  stage.addEventListener('pointerup', lift); stage.addEventListener('pointercancel', lift);
  // Arrow keys work like a fully pushed stick.
  const keys = new Set();
  document.addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); } });
  document.addEventListener('keyup', e => keys.delete(e.key));
  function stickInput() {
    const p = state.pointer;
    if (p.down) {
      const dx = p.sx - p.x0, dy = p.sy - p.y0, len = Math.hypot(dx, dy);
      if (len < STICK_DEAD) return [0, 0];
      const k = Math.min(1, (len - STICK_DEAD) / (STICK_FULL - STICK_DEAD)) / len;
      return [dx * k, dy * k];
    }
    const kx = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
    const ky = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);
    const kl = Math.hypot(kx, ky);
    return kl ? [kx / kl, ky / kl] : [0, 0];
  }

  /* ---------- game loop ---------- */
  function tick(now) {
    if (!state.running) return;
    const dt = Math.min(0.05, (now - state.last) / 1000 || 0); state.last = now;
    state.elapsed += dt;
    const h = state.hole;
    // Steer with the stick: speed up gently and coast to a stop when the finger lifts.
    const [sx, sy] = stickInput();
    const vmax = SPEED * Math.min(1.6, Math.max(1, h.r / R0 * 0.2));
    const ease = Math.min(1, dt * ((sx || sy) ? 5 : 4));
    h.vx += (sx * vmax - h.vx) * ease; h.vy += (sy * vmax - h.vy) * ease;
    h.x = Math.max(0, Math.min(state.world.w, h.x + h.vx * dt)); h.y = Math.max(0, Math.min(state.world.h, h.y + h.vy * dt));
    for (const p of state.pops) p.t += dt;
    state.pops = state.pops.filter(p => p.t < 1.2);
    h.gulp = Math.max(0, h.gulp - dt * 3);
    state.bumpCooldown -= dt;

    for (const it of state.items) {
      if (it.st === 'gone') continue;
      const or = it.s / 2;
      if (it.st === 'idle') {
        it.wob = Math.max(0, it.wob - dt * 2.5);
        const d = Math.hypot(it.x - h.x, it.y - h.y);
        if (or < h.r * EAT) {
          if (d < h.r * 0.95 - or * 0.3) { it.st = 'fall'; it.t = 0; }
        } else if (d < h.r + or * 0.4) {
          it.wob = 1;
          if (state.bumpCooldown <= 0) { sfx.bump(); state.bumpCooldown = 0.6; }
        }
      } else if (it.st === 'fall') {
        it.t += dt;
        it.x += (h.x - it.x) * Math.min(1, dt * 5); it.y += (h.y - it.y) * Math.min(1, dt * 5);
        if (it.t >= FALL) eat(it);
      }
    }
    updateCamera(dt);
    draw();
    if (state.running) requestAnimationFrame(tick);
  }

  function eat(it) {
    it.st = 'gone';
    const h = state.hole;
    const cfg = SIZES[state.size];
    h.r = Math.min(cfg.rmax, Math.sqrt(h.r * h.r + cfg.grow * (it.s / 2) ** 2));
    h.gulp = 1;
    sfx.gulp(it.tier);
    state.eaten++;
    // Show what was eaten: it pops up above the hole and joins the "just ate" strip.
    state.pops.push({ e: it.e, t: 0, jx: (Math.random() - 0.5) * 50 });
    const chip = document.createElement('span'); chip.textContent = it.e; chip.title = it.name;
    const recent = $('recent'); recent.append(chip);
    while (recent.children.length > RECENT) recent.firstElementChild.remove();
    if (it.tier >= 2) say(`吃掉${it.name}了！`);
    updateProgress();
    const next = state.canEat + 1;
    if (next < TIER_SIZE.length && TIER_SIZE[next] / 2 < h.r * EAT) {
      state.canEat = next;
      const sample = MAPS[state.map].tiers[next][0];
      setTimeout(() => {
        sfx.grow(); toast(`洞洞變大了！可以吃 <span class="emo">${sample[0]}</span> 了`);
        if (next < 3) say(`洞洞變大了！可以吃${sample[1]}了！`);
      }, 250);
    }
    if (state.eaten >= state.total) finish();
  }

  /* ---------- drawing ---------- */
  function drawGround() {
    const d = state.deco, { W, H, dpr } = state, z = ppu();
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = d.edge; g.fillRect(0, 0, W, H);           // outside the world
    // world-space shapes: scale the context so vector shapes stay crisp
    g.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - state.cam.x * z), dpr * (H / 2 - state.cam.y * z));
    const ww = state.world.w, wh = state.world.h;
    g.fillStyle = d.bg; g.fillRect(0, 0, ww, wh);
    if (d.sea) {
      g.fillStyle = '#5fc3ee'; g.fillRect(0, 0, ww, d.sea);
      g.fillStyle = '#bfe9f7'; g.fillRect(0, d.sea - 0.03, ww, 0.03);
      g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 0.008;
      for (let y = 0.08; y < d.sea - 0.05; y += 0.12) for (let x = 0.05; x < ww; x += 0.3) { g.beginPath(); g.arc(x + (y * 3 % 0.15), y, 0.05, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    }
    if (d.nebulas) for (const [x, y, r, c] of d.nebulas) {
      const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c + '66'); gr.addColorStop(1, c + '00');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    if (d.stars) { g.fillStyle = '#ffffff'; for (const [x, y, r, a] of d.stars) { g.globalAlpha = a; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); } g.globalAlpha = 1; }
    if (d.dots) { g.fillStyle = d.dot; for (const [x, y, r] of d.dots) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); } }
    if (d.paths) { g.strokeStyle = d.path; g.lineWidth = 0.07; g.lineCap = 'round'; for (const [a, b, c2, e] of d.paths) { g.beginPath(); g.moveTo(...a); g.bezierCurveTo(...b, ...c2, ...e); g.stroke(); } }
    if (d.ponds) { g.fillStyle = d.pond; for (const [x, y, rx, ry] of d.ponds) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); } }
    if (d.roads) {
      const { xs, ys, w } = d.roads;
      g.fillStyle = '#5d6672';
      for (const y of ys) g.fillRect(0, y - w / 2, ww, w);
      for (const x of xs) g.fillRect(x - w / 2, 0, w, wh);
      g.strokeStyle = '#ffffff'; g.lineWidth = 0.006; g.setLineDash([0.03, 0.03]);
      for (const y of ys) { g.beginPath(); g.moveTo(0, y); g.lineTo(ww, y); g.stroke(); }
      for (const x of xs) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, wh); g.stroke(); }
      g.setLineDash([]);
    }
    if (d.fields) for (const [x, y, w, h] of d.fields) { g.fillStyle = '#c9925a'; for (let k = 0; k < 6; k++) g.fillRect(x, y + k * h / 6, w, h / 12); }
    if (d.yards) for (const [x, y, w, h] of d.yards) { g.fillStyle = '#e8cf7a'; g.fillRect(x, y, w, h); g.strokeStyle = '#8a5a33'; g.lineWidth = 0.01; g.strokeRect(x, y, w, h); }
    if (d.mud) { g.fillStyle = '#9b7a4c'; for (const [x, y, rx, ry] of d.mud) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); } }
    if (d.lava) { for (const [x, y, rx, ry] of d.lava) { g.fillStyle = '#ff7a2a'; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); g.fillStyle = '#ffd23a'; g.beginPath(); g.ellipse(x, y, rx * 0.5, ry * 0.5, 0, 0, 7); g.fill(); } }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw() {
    const { W, H } = state; if (!W || !state.deco) return;
    g.setTransform(state.dpr, 0, 0, state.dpr, 0, 0); g.clearRect(0, 0, W, H);
    drawGround();
    const z = ppu(), h = state.hole, [hx, hy] = toScreen(h.x, h.y);
    const hr = h.r * z * (1 + (reduceMotion ? 0 : Math.sin(h.gulp * Math.PI) * 0.06));

    // the hole
    g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.arc(hx, hy + hr * 0.08, hr * 1.08, 0, Math.PI * 2); g.fill();
    const grad = g.createRadialGradient(hx, hy + hr * 0.15, hr * 0.1, hx, hy, hr);
    grad.addColorStop(0, '#05060a'); grad.addColorStop(0.75, '#141826'); grad.addColorStop(1, '#2d3448');
    g.fillStyle = grad; g.beginPath(); g.arc(hx, hy, hr, 0, Math.PI * 2); g.fill();
    g.strokeStyle = state.map === 'space' ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.35)'; g.lineWidth = Math.max(3, hr * 0.06);
    g.beginPath(); g.arc(hx, hy, hr - g.lineWidth / 2, 0, Math.PI * 2); g.stroke();

    g.textAlign = 'center'; g.textBaseline = 'middle';
    // things falling in, clipped to the hole
    g.save(); g.beginPath(); g.arc(hx, hy, hr, 0, Math.PI * 2); g.clip();
    for (const it of state.items) {
      if (it.st !== 'fall') continue;
      const p = Math.min(1, it.t / FALL), [sx, sy] = toScreen(it.x, it.y), size = it.s * z * (1 - p * 0.9);
      g.save(); g.translate(sx, sy); g.rotate(reduceMotion ? 0 : p * 5);
      g.globalAlpha = 1 - p * 0.5; g.fillStyle = '#000'; g.font = `${size}px ${EMOJI_FONT}`; g.fillText(it.e, 0, 0); g.restore();
    }
    g.restore();

    // standing things on screen, back to front
    const pad = 0.15 * z;
    const standing = state.items.filter(it => it.st === 'idle').sort((a, b) => a.y - b.y);
    let edibleOnScreen = false;
    for (const it of standing) {
      const [ox, oy] = toScreen(it.x, it.y), size = it.s * z;
      if (ox < -pad || ox > W + pad || oy < -pad || oy > H + pad) continue;
      if (it.s / 2 < h.r * EAT && ox > 0 && ox < W && oy > 0 && oy < H) edibleOnScreen = true;
      g.fillStyle = 'rgba(0,0,0,.15)';
      g.beginPath(); g.ellipse(ox, oy + size * 0.42, size * 0.38, size * 0.1, 0, 0, Math.PI * 2); g.fill();
      g.save(); g.translate(ox, oy);
      if (it.wob && !reduceMotion) g.rotate(Math.sin(it.wob * 25) * it.wob * 0.15);
      g.fillStyle = '#000'; // a translucent fill would also fade colour emoji
      g.font = `${size}px ${EMOJI_FONT}`; g.fillText(it.e, 0, 0); g.restore();
    }

    // Nothing to eat in view, or only a few things left: point at the nearest edible things.
    const left = standing.length;
    if (state.running && left && (!edibleOnScreen || left <= 8)) drawArrows(standing, hx, hy);
    // Outline the hole on top of everything, so it stays visible when it slips under a house or a tree.
    g.save();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 3; g.setLineDash([10, 8]);
    g.beginPath(); g.arc(hx, hy, hr + 3, 0, Math.PI * 2); g.stroke();
    g.restore();
    drawPops(hx, hy, hr);
    drawStick();
    drawMinimap(standing);
  }

  // The joystick under the finger: a ring where it pressed and a knob that follows the slide.
  function drawStick() {
    const p = state.pointer; if (!p.down || !state.running) return;
    const dx = p.sx - p.x0, dy = p.sy - p.y0, len = Math.hypot(dx, dy), k = len > STICK_FULL ? STICK_FULL / len : 1;
    g.save();
    g.fillStyle = 'rgba(255,255,255,.25)'; g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 4;
    g.beginPath(); g.arc(p.x0, p.y0, STICK_FULL, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = 'rgba(43,89,195,.75)'; g.beginPath(); g.arc(p.x0 + dx * k, p.y0 + dy * k, 30, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#ffffff'; g.lineWidth = 3; g.stroke();
    g.restore();
  }

  // Things just eaten float up out of the hole on a white badge so a child can see them.
  function drawPops(hx, hy, hr) {
    for (const p of state.pops) {
      const k = p.t / 1.2, rise = reduceMotion ? 0 : k * 70;
      const size = 54 * (1 + 0.25 * Math.min(1, k * 4)), alpha = 0.98 * (k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4);
      const x = hx + p.jx, y = hy - hr - size * 0.55 - rise;
      g.save(); g.globalAlpha = alpha;
      g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x, y, size * 0.62, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#000'; g.font = `${size}px ${EMOJI_FONT}`; g.fillText(p.e, x, y + 2);
      g.restore();
    }
  }

  function drawArrows(standing, hx, hy) {
    const { W, H } = state, h = state.hole;
    const edible = standing.filter(it => it.s / 2 < h.r * EAT);
    const pool = (edible.length ? edible : standing)
      .map(it => ({ it, d: Math.hypot(it.x - h.x, it.y - h.y), p: toScreen(it.x, it.y) }))
      .filter(o => o.p[0] < 0 || o.p[0] > W || o.p[1] < 0 || o.p[1] > H)
      .sort((a, b) => a.d - b.d).slice(0, 3);
    const m = 40;
    for (const { it, p } of pool) {
      const ang = Math.atan2(p[1] - H / 2, p[0] - W / 2);
      // where the ray from the centre leaves the screen (inset by the margin)
      const kx = (W / 2 - m) / Math.abs(Math.cos(ang) || 1e-6), ky = (H / 2 - m) / Math.abs(Math.sin(ang) || 1e-6);
      const k = Math.min(kx, ky), ax = W / 2 + Math.cos(ang) * k, ay = H / 2 + Math.sin(ang) * k;
      g.save(); g.translate(ax, ay);
      g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.arc(0, 0, 26, 0, 7); g.fill();
      g.rotate(ang); g.fillStyle = '#2b59c3'; g.beginPath(); g.moveTo(36, 0); g.lineTo(24, -10); g.lineTo(24, 10); g.closePath(); g.fill();
      g.rotate(-ang);
      g.globalAlpha = 0.9; g.fillStyle = '#000'; g.font = `30px ${EMOJI_FONT}`; g.fillText(it.e, 0, 1); g.restore();
    }
  }

  function drawMinimap(standing) {
    const { W, H } = state, w = state.world, z = ppu();
    if (W / z >= w.w * 0.98 && H / z >= w.h * 0.98) return;     // whole world already in view
    let mw = Math.min(140, W * 0.24), mh = mw * w.h / w.w;
    if (mh > H * 0.28) { mh = H * 0.28; mw = mh * w.w / w.h; }
    const x0 = W - mw - 12, y0 = 12, s = mw / w.w;
    g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath();
    if (g.roundRect) g.roundRect(x0 - 4, y0 - 4, mw + 8, mh + 8, 10); else g.rect(x0 - 4, y0 - 4, mw + 8, mh + 8);
    g.fill();
    g.fillStyle = state.deco.bg; g.fillRect(x0, y0, mw, mh);
    const h = state.hole;
    for (const it of standing) {
      g.fillStyle = it.s / 2 < h.r * EAT ? '#2fb36f' : 'rgba(30,42,74,.45)';
      g.beginPath(); g.arc(x0 + it.x * s, y0 + it.y * s, Math.max(1.5, it.s * s * 0.5), 0, 7); g.fill();
    }
    g.fillStyle = '#05060a'; g.beginPath(); g.arc(x0 + h.x * s, y0 + h.y * s, Math.max(3, h.r * s), 0, 7); g.fill();
    const vw = W / z * s, vh = H / z * s;
    g.strokeStyle = '#2b59c3'; g.lineWidth = 2;
    g.strokeRect(x0 + state.cam.x * s - vw / 2, y0 + state.cam.y * s - vh / 2, vw, vh);
  }

  /* ---------- round flow ---------- */
  function updateProgress() {
    $('fill').style.width = (state.total ? state.eaten / state.total * 100 : 0) + '%';
    $('track').setAttribute('aria-valuemax', state.total); $('track').setAttribute('aria-valuenow', state.eaten);
    $('count').innerHTML = `${state.eaten} / ${state.total}`;
  }
  function newGame() {
    stop();
    $('win').hidden = true; stopConfetti();
    stage.querySelector('.toast')?.remove();
    buildWorld();
    const w = state.world;
    Object.assign(state.hole, { x: w.w / 2, y: w.h / 2, vx: 0, vy: 0, r: R0, gulp: 0 });
    Object.assign(state.cam, { x: w.w / 2, y: w.h / 2, zoom: 1 });
    Object.assign(state, { eaten: 0, total: state.items.length, canEat: 0, elapsed: 0, pops: [] });
    $('recent').innerHTML = '';
    state.pointer.down = false;
    stage.style.background = state.deco.bg;
    updateCamera(0, true); updateProgress();
    $('goText').textContent = '開始'; $('start').hidden = false;
    syncToolbar(); draw();
  }
  function begin() {
    audio(); say('按住畫面，往想去的方向滑，洞洞就會走！先吃小的喔！');
    if (!state.eaten) toast('👆 按住畫面，往想去的方向滑');
    $('start').hidden = true;
    state.running = true; state.last = performance.now();
    requestAnimationFrame(tick);
  }
  function stop() { state.running = false; }
  function pause() {
    if (!state.running) return;
    stop(); state.pointer.down = false; $('goText').textContent = '繼續'; $('start').hidden = false; draw();
  }
  function finish() {
    stop();
    setTimeout(() => {
      const stars = state.elapsed <= SIZES[state.size].stars ? 3 : 2; // always encouraging: at least 2 stars
      $('stars').innerHTML = [0, 1, 2].map(i => i < stars ? '⭐' : '<span class="dim">⭐</span>').join('');
      $('winTitle').textContent = `${MAPS[state.map].label}全部吃光光了！`;
      $('win').hidden = false;
      sfx.win(); say('全部吃光光了！好厲害！');
      startConfetti();
      $('again').focus();
    }, 500);
  }
  $('go').addEventListener('click', begin);
  $('again').addEventListener('click', () => { newGame(); begin(); });
  $('next').addEventListener('click', () => {
    state.map = MAP_KEYS[(MAP_KEYS.indexOf(state.map) + 1) % MAP_KEYS.length]; store.set('map', state.map);
    newGame(); begin();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  /* ---------- toolbar ---------- */
  for (const key of MAP_KEYS) {
    const mp = MAPS[key], b = document.createElement('button');
    b.className = 'chip'; b.dataset.key = key; b.setAttribute('aria-label', mp.label);
    b.innerHTML = `<span class="emo">${mp.icon}</span><span class="txt">${mp.label}</span>`;
    b.addEventListener('click', () => { state.map = key; store.set('map', key); newGame(); });
    $('maps').append(b);
  }
  for (const [key, sz] of Object.entries(SIZES)) {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.key = key; b.setAttribute('aria-label', sz.label);
    b.innerHTML = `<span class="sz"><i style="width:${sz.icon}px;height:${sz.icon}px"></i></span><span class="txt">${sz.label}</span>`;
    b.addEventListener('click', () => { state.size = key; store.set('size', key); newGame(); });
    $('sizes').append(b);
  }
  $('sound').addEventListener('click', () => {
    state.sound = !state.sound; store.set('sound', state.sound);
    if (!state.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
    syncToolbar();
  });
  $('restart').addEventListener('click', newGame);
  function syncToolbar() {
    [...$('maps').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.key === state.map));
    [...$('sizes').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.key === state.size));
    $('sound').setAttribute('aria-pressed', state.sound);
    $('sound').querySelector('.emo').textContent = state.sound ? '🔊' : '🔇';
  }

  /* ---------- confetti ---------- */
  let confettiRaf = 0, confettiCanvas = null;
  function startConfetti() {
    if (reduceMotion) return;
    stopConfetti();
    const c = confettiCanvas = document.createElement('canvas');
    c.className = 'confetti'; document.body.append(c);
    const dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    const cg = c.getContext('2d'); cg.scale(dpr, dpr);
    const colors = ['#2b59c3', '#ff6b5b', '#2fb36f', '#ffd34e', '#a463f2'];
    const bits = Array.from({ length: 140 }, () => ({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6,
      vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2,
      w: 8 + Math.random() * 8, h: 5 + Math.random() * 6, color: rand(colors),
    }));
    const t0 = performance.now();
    (function frame(now) {
      cg.clearRect(0, 0, innerWidth, innerHeight);
      for (const b of bits) {
        b.x += b.vx; b.y += b.vy; b.r += b.vr;
        cg.save(); cg.translate(b.x, b.y); cg.rotate(b.r); cg.fillStyle = b.color;
        cg.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); cg.restore();
      }
      if (now - t0 < 4500) confettiRaf = requestAnimationFrame(frame); else stopConfetti();
    })(t0);
  }
  function stopConfetti() {
    cancelAnimationFrame(confettiRaf);
    if (confettiCanvas) { confettiCanvas.remove(); confettiCanvas = null; }
  }

  // Wait for the first layout so the world is sized for the real screen.
  requestAnimationFrame(() => { resize(); newGame(); });
})();
</script>
</body>
</html>
